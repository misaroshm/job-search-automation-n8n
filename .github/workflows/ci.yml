name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Workflows are up to date with the sources
        run: |
          npm run build
          git diff --exit-code workflows/ || (echo "Run 'npm run build' and commit workflows/" && exit 1)
